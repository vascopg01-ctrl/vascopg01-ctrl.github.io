<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Keyla Vera 💕</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #fce7f3, #e9d5ff, #ddd6fe);
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 38px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.82);
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(150, 70, 150, 0.25);
            backdrop-filter: blur(12px);
        }

        .avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ec4899, #a855f7);
            color: white;
            font-size: 48px;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(190, 70, 170, 0.35);
        }

        h1 {
            color: #a13b82;
            font-size: 31px;
            margin-bottom: 8px;
        }

        .texto {
            color: #777;
            font-size: 15px;
            margin-bottom: 28px;
        }

        .boton {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 14px 0;
            border-radius: 18px;
            text-decoration: none;
            color: white;
            font-size: 17px;
            font-weight: bold;
            background: linear-gradient(135deg, #ec4899, #a855f7);
            box-shadow: 0 6px 15px rgba(180, 70, 170, 0.25);
            transition: 0.3s;
        }

        .boton:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 22px rgba(180, 70, 170, 0.35);
        }

        .decoracion {
            margin-top: 25px;
            color: #d45aa9;
            font-size: 20px;
            letter-spacing: 5px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="avatar">K</div>

        <h1>Keyla Vera 💕</h1>

        <p class="texto">
            Bienvenidos a mi espacio ✨
        </p>

        <a class="boton"
           href="https://www.instagram.com/whos.keiiii_/"
           target="_blank">
            📸 Instagram
        </a>

        <a class="boton"
           href="https://www.tiktok.com/@valee1967"
           target="_blank">
            🎵 TikTok
        </a>

        <a class="boton"
           href="https://wa.me/593989315527"
           target="_blank">
            💬 WhatsApp
        </a>

        <div class="decoracion">
            ♡ ✨ ♡ ✨ ♡
        </div>

    </div>

</body>
</html>
